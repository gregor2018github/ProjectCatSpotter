name: cat_spotter
description: A local app to spot and track cats by location.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Maps — OpenStreetMap, no API key required
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Camera / image selection
  image_picker: ^1.1.2

  # GPS / geolocation
  geolocator: ^13.0.2

  # Local SQLite database
  sqflite: ^2.3.3

  # File system paths
  path_provider: ^2.1.4
  path: ^1.9.0

  # State management
  flutter_riverpod: ^2.5.1

  # Permissions
  permission_handler: ^11.4.0

  # Unique IDs
  uuid: ^4.5.1

  # Date formatting
  intl: ^0.20.1

  # Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
